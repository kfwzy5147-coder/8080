<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سحب الولاد - أسرة القديس اغسطينوس</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-primary: #0b132b;
            --bg-card: #1c2541;
            --accent-blue: #3a86ff;
            --accent-gold: #ffbe0b;
            --accent-red: #ff0055;
            --accent-green: #00f5d4;
            --text-main: #ffffff;
            --text-muted: #8d99ae;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px; background-image: radial-gradient(circle at 50% 50%, #1c2541 0%, #0b132b 100%); }
        .container { width: 100%; max-width: 480px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 25px; }
        .logo-icon { font-size: 45px; margin-bottom: 5px; display: inline-block; background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 50%; border: 2px solid var(--accent-blue); box-shadow: 0 0 20px rgba(58, 134, 255, 0.3); }
        h1 { font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: var(--text-muted); }
        .card { background: var(--bg-card); border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 20px; }
        .badge-boys { background: rgba(58, 134, 255, 0.15); color: var(--accent-blue); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; display: inline-block; margin-bottom: 15px; border: 1px solid var(--accent-blue); }
        .form-group { margin-bottom: 18px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted); }
        input { width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.2); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #fff; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent-blue); box-shadow: 0 0 10px rgba(58, 134, 255, 0.3); }
        .btn-submit { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--accent-blue), #00b4d8); border: none; border-radius: 12px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(58, 134, 255, 0.4); }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(58, 134, 255, 0.6); }
        .result-screen { display: none; text-align: center; padding: 20px 0; }
        .win-title { color: var(--accent-gold); font-size: 26px; font-weight: 900; margin-bottom: 10px; }
        .win-prize { font-size: 22px; color: var(--accent-green); font-weight: bold; margin: 15px 0; padding: 15px; background: rgba(0, 245, 212, 0.1); border-radius: 12px; border: 1px dashed var(--accent-green); }
        .lose-title { color: var(--accent-red); font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .counter-badge { font-size: 15px; color: var(--accent-gold); margin-top: 15px; font-weight: bold; }
        .footer-credit { text-align: center; font-size: 14px; color: var(--text-muted); margin-top: 20px; font-weight: bold; direction: ltr; }
        .admin-panel { display: none; background: #10172a; border-radius: 20px; padding: 20px; margin-top: 20px; border: 2px solid var(--accent-gold); }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        .admin-table th, .admin-table td { padding: 10px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .admin-table th { background: rgba(255, 190, 11, 0.2); color: var(--accent-gold); }
        .btn-danger { background: var(--accent-red); color: #fff; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .btn-export { background: var(--accent-green); color: #000; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: bold; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-icon">👑</div>
            <h1>سحب الولاد - أسرة القديس اغسطينوس</h1>
            <div class="subtitle">سحب الهدية الكبرى للشباب 🎁✨</div>
        </div>

        <div class="card" id="formCard">
            <div style="text-align: center;">
                <span class="badge-boys">🙋‍♂️ سحب خاص بالولاد فقط</span>
            </div>
            
            <form id="drawForm">
                <div class="form-group">
                    <label>الاسم الثلاثي 👤</label>
                    <input type="text" id="userName" placeholder="ادخل اسمك بالكامل" required autocomplete="off">
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">دخول السحب ومعرفة النتيجة ✨</button>
            </form>
        </div>

        <div class="card result-screen" id="resultCard">
            <div id="resultContent"></div>
            <div class="counter-badge" id="participantNum"></div>
        </div>

        <div class="admin-panel" id="adminPanel">
            <h2 style="color: var(--accent-gold); text-align: center;">👑 لوحة تحكم الأدمن (سحب الولاد الموحد)</h2>
            <div style="text-align: center; margin-top: 15px;">
                <button class="btn-export" onclick="exportData()">تصدير البيانات CSV 📥</button>
                <button class="btn-danger" onclick="resetSystemData()">تصفير السحب بالكامل 🔄</button>
                <button class="btn-danger" style="background:#555" onclick="logoutAdmin()">خروج من الأدمن 🚪</button>
            </div>
            <div style="overflow-x:auto; margin-top: 15px;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>الاسم</th>
                            <th>الحالة</th>
                            <th>الوقت</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="footer-credit">
            اعداد / ⌬"𝙆𝘼𝙍𝙊_𝘾𝙎 ⌬ 💻🔥
        </div>
    </div>

    <script>
        var isAdmin = window.location.search.indexOf('admin=true') !== -1;
        const FIREBASE_URL = "https://augustine-draw-default-rtdb.firebaseio.com/boys_v9.json";

        async function fetchLiveCloudData() {
            try {
                let res = await fetch(FIREBASE_URL);
                let data = await res.json();
                if (!data) return [];
                let list = Object.values(data);
                list.sort((a, b) => a.id - b.id);
                return list;
            } catch(e) {
                return [];
            }
        }

        if (isAdmin) {
            document.getElementById('formCard').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            renderAdminTable();
            setInterval(renderAdminTable, 3000);
        }

        const playWinSound = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1046.50, ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch(e){}
        };

        const playLoseSound = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch(e){}
        };

        document.getElementById('drawForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value.trim();
            if (!name) return;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "جاري حجز الترتيب... ⏳";

            let currentParticipants = await fetchLiveCloudData();

            const hasPlayed = localStorage.getItem('boys_played_device_v9');
            const nameExists = currentParticipants.some(p => p.name.toLowerCase() === name.toLowerCase());

            const formCard = document.getElementById('formCard');
            const resultCard = document.getElementById('resultCard');
            const resultContent = document.getElementById('resultContent');
            const participantNum = document.getElementById('participantNum');

            formCard.style.display = 'none';
            resultCard.style.display = 'block';

            if (hasPlayed || nameExists) {
                playLoseSound();
                resultContent.innerHTML = `
                    <div class="lose-title">⚠️ محاولة مكررة</div>
                    <p style="color: var(--text-muted); font-size: 18px;">تم تسجيل هذا الاسم أو الجهاز سابقاً!</p>
                `;
                participantNum.innerText = `حاول الاجتماع الجاي 🤝`;
                return;
            }

            const currentNum = currentParticipants.length + 1;
            const now = new Date();
            const timeStr = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
            
            let status = "";
            if (currentNum === 18) {
                status = "فائز كاب هولدر 🎁✨";
                playWinSound();
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
                resultContent.innerHTML = `
                    <div class="win-title">🎉 ألف مبروك يا بطل! 🎉</div>
                    <div class="win-prize">كسبت كاب هولدر 🎁✨</div>
                    <p style="color: var(--text-muted); font-size: 14px;">احتفظ باللقطة دي واستلم هديتك من الخدام 🥳</p>
                `;
            } else if (currentNum < 18) {
                status = "لم يحالفه الحظ";
                playLoseSound();
                resultContent.innerHTML = `
                    <div class="lose-title">خيرها في غيرها يا صاحبي 😔</div>
                    <p style="color: var(--text-muted); font-size: 16px; margin-top: 10px;">حاول الاجتماع الجاي</p>
                `;
            } else {
                status = "متأخر بعد #18";
                playLoseSound();
                resultContent.innerHTML = `
                    <div class="lose-title">للاسف جيت متاخر حاول الاجتماع الجاي ⏳</div>
                    <p style="color: var(--text-muted); font-size: 15px; margin-top: 10px;">انتهت الجائزة الكبرى لهذا اليوم</p>
                `;
            }

            participantNum.innerText = `أنت المشارك رقم #${currentNum} في السحب الموحد`;

            localStorage.setItem('boys_played_device_v9', 'true');
            
            await fetch(FIREBASE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: currentNum, name: name, status: status, time: timeStr })
            });
        });

        async function renderAdminTable() {
            const tbody = document.getElementById('adminTableBody');
            const data = await fetchLiveCloudData();
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">لا يوجد مشاركين حتى الآن 📭</td></tr>';
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.name}</td>
                    <td style="color: ${item.id === 18 ? 'var(--accent-gold)' : '#fff'}; font-weight: bold;">${item.status}</td>
                    <td>${item.time}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function resetSystemData() {
            if (confirm("هل أنت تأكد من تصفير داتابيز السحب بالكامل ورجوع العداد لـ 0؟")) {
                await fetch(FIREBASE_URL, { method: 'DELETE' });
                localStorage.removeItem('boys_played_device_v9');
                alert("تم تصفير الداتابيز بنجاح!");
                window.location.href = window.location.pathname + '?admin=true';
            }
        }

        function logoutAdmin() {
            window.location.href = window.location.pathname;
        }

        async function exportData() {
            const data = await fetchLiveCloudData();
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "الترتيب,الاسم,الحالة,الوقت\n";
            data.forEach(r => {
                csvContent += `${r.id},"${r.name}","${r.status}","${r.time}"\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "boys_giveaway_database.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
